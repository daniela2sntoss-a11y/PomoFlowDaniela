<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e9eee9" />
  <title>PomoFlow — Entra en tu zona</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary:#edf1ec; --bg-secondary:#e4eae3; --surface:rgba(255,255,255,.66);
      --surface-strong:rgba(255,255,255,.84); --text-primary:#26352e; --text-secondary:#718078;
      --accent-primary:#648574; --accent-soft:#dce8df; --accent-dark:#496b59;
      --line:rgba(68,91,77,.13); --shadow:0 18px 55px rgba(54,75,61,.08);
      --ring-track:#dce5dd; --success:#6b9278; --danger:#b8756c;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#f8faf6 0,transparent 42%),linear-gradient(135deg,var(--bg-primary),var(--bg-secondary));color:var(--text-primary);font-family:"DM Sans",sans-serif}
    h1,h2,h3,.display{font-family:"Manrope",sans-serif}
    .glass{background:var(--surface);border:1px solid rgba(255,255,255,.76);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .glass-strong{background:var(--surface-strong);border:1px solid var(--line);backdrop-filter:blur(20px)}
    .muted{color:var(--text-secondary)}
    .eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--text-secondary)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:14px;padding:.72rem 1rem;font-size:.88rem;font-weight:700;transition:.18s ease;border:1px solid transparent}
    .btn-primary{background:var(--accent-primary);color:white;box-shadow:0 7px 18px rgba(73,107,89,.18)}
    .btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px)}
    .btn-soft{background:var(--accent-soft);color:var(--accent-dark);border-color:rgba(100,133,116,.12)}
    .btn-soft:hover{background:#d1e0d5}
    .btn-quiet{background:rgba(255,255,255,.52);color:var(--text-secondary);border-color:var(--line)}
    .btn-quiet:hover{color:var(--text-primary);background:white}
    .field{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:12px;padding:.72rem .85rem;color:var(--text-primary);outline:none}
    .field:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px rgba(100,133,116,.12)}
    .tab{padding:.6rem .9rem;border-radius:12px;color:var(--text-secondary);font-size:.84rem;font-weight:700}
    .tab.active{background:var(--accent-soft);color:var(--accent-dark)}
    .mode{border:1px solid var(--line);background:rgba(255,255,255,.48);border-radius:13px;padding:.65rem .8rem;font-size:.8rem;font-weight:700;color:var(--text-secondary)}
    .mode.active{background:var(--accent-soft);color:var(--accent-dark);border-color:rgba(100,133,116,.28)}
    .task-row{display:flex;align-items:center;gap:.75rem;padding:.82rem .15rem;border-bottom:1px solid var(--line)}
    .task-row:last-child{border-bottom:0}
    .task-check{width:19px;height:19px;accent-color:var(--accent-primary);flex-shrink:0}
    .task-done .task-name{text-decoration:line-through;color:#98a39b}
    .pill{font-size:.68rem;font-weight:700;padding:.28rem .55rem;border-radius:99px;background:#edf1ed;color:#718078}
    .pill.easy{background:#e7efe8;color:#64836c}.pill.medium{background:#f1eee2;color:#93804c}.pill.hard{background:#f2e8e5;color:#a56e64}
    .ring-wrap{position:relative;width:min(270px,68vw);aspect-ratio:1;margin:auto}
    .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
    .ring-track{fill:none;stroke:var(--ring-track);stroke-width:8}
    .ring-progress{fill:none;stroke:var(--accent-primary);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
    .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .timer-time{font-family:"Manrope",sans-serif;font-size:clamp(2.65rem,7vw,3.7rem);font-weight:700;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
    .modal-backdrop{position:fixed;inset:0;background:rgba(30,43,35,.35);backdrop-filter:blur(7px);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal{width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:26px;background:#f8faf7;border:1px solid white;box-shadow:0 24px 80px rgba(28,45,34,.2);padding:clamp(1.2rem,4vw,2rem)}
    .choice{border:1px solid var(--line);background:white;border-radius:15px;padding:1rem;text-align:left;transition:.18s}
    .choice.selected{border-color:var(--accent-primary);background:var(--accent-soft)}
    .word-cell{width:clamp(42px,10vw,52px);height:clamp(42px,10vw,52px);border:1.5px solid #cbd5cc;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:1.25rem;text-transform:uppercase}
    .word-cell.correct{background:#72947d;color:white;border-color:#72947d}.word-cell.present{background:#c6a96b;color:white;border-color:#c6a96b}.word-cell.absent{background:#89958d;color:white;border-color:#89958d}
    .key{border-radius:7px;background:#e5ebe5;padding:.7rem .45rem;font-size:.8rem;font-weight:800;min-width:27px}
    .cross-cell{width:40px;height:40px;border:1px solid #9aa99e;position:relative;background:white;display:grid;place-items:center;font-weight:800;text-transform:uppercase}
    .cross-cell.block{background:#40554a;border-color:#40554a}
    .cross-cell small{position:absolute;top:1px;left:3px;font-size:8px;color:#718078;font-weight:500}
    .breath-orb{width:148px;height:148px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eff5ef,#b8cdbd);box-shadow:inset 0 0 25px rgba(255,255,255,.8),0 12px 35px rgba(93,128,103,.12);transition:transform 4s ease-in-out}
    .breath-orb.inhale{transform:scale(1.17)}.breath-orb.hold{transform:scale(1.17)}.breath-orb.exhale{transform:scale(.82);transition-duration:8s}
    .sound-active{background:var(--accent-soft)!important;color:var(--accent-dark)!important;border-color:var(--accent-primary)!important}
    input[type=range]{accent-color:var(--accent-primary);width:100%}
    @media(max-width:760px){.main-grid{grid-template-columns:1fr}.timer-card{order:0}.mission-card{order:1}.side-card{order:2}}
    .focus-backdrop{position:fixed;inset:0;z-index:80;background:linear-gradient(145deg,#edf1ec,#e3eae2);display:flex;align-items:center;justify-content:center;padding:1.25rem}
    .focus-screen{width:min(760px,100%);min-height:min(850px,94dvh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:2rem 1rem}
    .focus-screen .ring-wrap{width:min(390px,76vw);margin:1.5rem auto}
    .focus-screen .timer-time{font-size:clamp(3.6rem,12vw,6rem)}
    .focus-close{position:absolute;top:0;right:0}
    .focus-screen .focus-mode-label{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-secondary);font-weight:700}
    .game-backdrop{padding:0;align-items:stretch}
    .modal.game-fullscreen{width:100%;height:100dvh;max-height:100dvh;border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(1.2rem,5vw,3.5rem);overflow-y:auto}
    .game-fullscreen .word-cell{width:clamp(48px,10vw,62px);height:clamp(48px,10vw,62px)}
    @media(max-width:600px){.focus-screen{min-height:90dvh;padding:1rem .25rem}.focus-screen .ring-wrap{width:min(330px,78vw)}}

  </style>
</head>
<body>
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-9">
    <header class="flex items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-white/75 border border-white flex items-center justify-center text-xl shadow-sm">◒</div>
        <div><div class="display text-xl font-extrabold tracking-tight">PomoFlow<span class="text-[var(--accent-primary)]">.</span></div><div class="text-xs muted">Menos ruido. Más intención.</div></div>
      </div>
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center gap-2 glass rounded-full px-3 py-2 text-xs muted"><span class="w-2 h-2 rounded-full bg-[var(--success)]"></span><span id="statusText">Listo para empezar</span></div>
        <button class="btn btn-quiet !p-3" id="settingsBtn" aria-label="Ajustes" title="Ajustes">⚙</button>
      </div>
    </header>

    <section class="mb-7 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
      <div><p class="eyebrow mb-2">Tu espacio de concentración</p><h1 class="display text-3xl sm:text-4xl font-extrabold tracking-tight">Entra en tu zona.</h1><p class="muted mt-2 text-sm">Un objetivo cada vez. El progreso llega después.</p></div>
      <div class="glass rounded-2xl px-4 py-3 flex items-center gap-4 self-start sm:self-auto">
        <div><p class="eyebrow">Sesiones completadas</p><p class="display text-2xl font-bold" id="sessionCount">0</p></div>
        <div class="w-px h-9 bg-[var(--line)]"></div>
        <div><p class="eyebrow">Minutos de foco</p><p class="display text-2xl font-bold" id="focusMinutes">0</p></div>
      </div>
    </section>

    <div class="main-grid grid grid-cols-1 lg:grid-cols-[1.45fr_.9fr] gap-5 items-start">
      <section class="timer-card glass rounded-[28px] p-5 sm:p-8">
        <div class="flex items-center justify-between gap-3 mb-6">
          <div><p class="eyebrow mb-1">Temporizador</p><h2 class="font-bold text-lg" id="modeTitle">Sesión de enfoque</h2></div>
          <div class="flex items-center gap-1.5 text-xs muted"><span class="w-2 h-2 rounded-full bg-[var(--accent-primary)]"></span><span id="timerState">Preparado</span></div>
        </div>
        <div class="flex justify-center gap-2 mb-7 flex-wrap" id="modeButtons">
          <button class="mode active" data-mode="focus">Enfoque</button><button class="mode" data-mode="short">Pausa corta</button><button class="mode" data-mode="long">Pausa larga</button>
        </div>
        <div class="ring-wrap mb-5">
          <svg viewBox="0 0 220 220" aria-label="Progreso del temporizador">
            <circle class="ring-track" cx="110" cy="110" r="98"></circle>
            <circle class="ring-progress" id="progressRing" cx="110" cy="110" r="98"></circle>
          </svg>
          <div class="ring-center"><div class="eyebrow mb-1" id="timerCaption">TIEMPO PARA TI</div><div class="timer-time" id="timerDisplay">25:00</div><div class="text-xs muted mt-1" id="timerSub">Un paso, sin interrupciones</div></div>
        </div>
        <div class="max-w-sm mx-auto mb-6">
          <div class="flex justify-between text-xs muted mb-2"><label for="durationRange" id="durationLabel">Duración de enfoque</label><strong id="durationValue" class="text-[var(--accent-dark)]">25 min</strong></div>
          <input type="range" id="durationRange" min="10" max="60" step="5" value="25">
          <div class="flex justify-between text-[10px] muted mt-1"><span>10 min</span><span>60 min</span></div>
        </div>
        <div class="flex justify-center items-center gap-3">
          <button class="btn btn-quiet" id="resetBtn" title="Reiniciar">↺</button>
          <button class="btn btn-primary min-w-36" id="startBtn">▶ Comenzar</button>
          <button class="btn btn-quiet" id="skipBtn" title="Siguiente modo">↠</button>
        </div>
        <p class="text-center text-xs muted mt-5">Consejo: define una misión antes de iniciar tu sesión.</p>
      </section>

      <div class="flex flex-col gap-5">
        <section class="mission-card glass rounded-[26px] p-5 sm:p-6">
          <div class="flex items-start justify-between gap-3 mb-4"><div><p class="eyebrow mb-1">Tablón de misiones</p><h2 class="font-bold text-lg">Tu siguiente objetivo</h2></div><span class="pill" id="taskCounter">0 pendientes</span></div>
          <form id="taskForm" class="flex gap-2 mb-3"><input id="taskInput" class="field !py-3 min-w-0" maxlength="90" placeholder="¿Qué vas a conseguir?" required><button class="btn btn-primary !px-4" aria-label="Añadir misión">＋</button></form>
          <div class="grid grid-cols-3 gap-2 mb-3">
            <select id="taskDifficulty" class="field !py-2 text-xs"><option value="easy">Fácil</option><option value="medium" selected>Media</option><option value="hard">Difícil</option></select>
            <select id="taskEstimate" class="field !py-2 text-xs col-span-2"><option value="1">1 bloque de enfoque</option><option value="2">2 bloques de enfoque</option><option value="3">3+ bloques de enfoque</option></select>
          </div>
          <div id="taskList" class="min-h-20"></div>
          <div class="flex justify-between items-center mt-3 pt-3 border-t border-[var(--line)]"><span class="text-xs muted" id="taskProgress">Completa una misión para avanzar.</span><button id="clearDoneBtn" class="text-xs font-bold muted hover:text-[var(--accent-dark)]">Limpiar hechas</button></div>
        </section>

        <section class="side-card glass rounded-[26px] p-5 sm:p-6">
          <div class="flex items-center justify-between mb-4"><div><p class="eyebrow mb-1">Ambiente sonoro</p><h2 class="font-bold text-lg">Acompaña tu foco</h2></div><span class="text-xl">♫</span></div>
          <p class="text-xs muted mb-3">Sonidos suaves generados en tu navegador. Volumen bajo recomendado.</p>
          <p class="text-[11px] muted -mt-1 mb-3">Los binaurales requieren auriculares estéreo y se reproducen a volumen suave.</p>
          <div class="grid grid-cols-2 gap-2" id="soundList">
            <button class="btn btn-quiet !justify-start !text-xs" data-sound="rain">☂ Lluvia suave</button>
            <button class="btn btn-quiet !justify-start !text-xs" data-sound="forest">♧ Bosque</button>
            <button class="btn btn-quiet !justify-start !text-xs" data-sound="ocean">≈ Oleaje</button>
            <button class="btn btn-quiet !justify-start !text-xs" data-sound="wind">⌁ Brisa</button>
            <button class="btn btn-quiet !justify-start !text-xs" data-sound="brown">◌ Ruido marrón</button>
            <button class="btn btn-quiet !justify-start !text-xs" data-sound="white">◌ Ruido blanco</button>
            <button class="btn btn-quiet !justify-start !text-xs col-span-2" data-sound="night">✧ Noche tranquila</button>
            <button class="btn btn-quiet !justify-start !text-xs col-span-2" data-sound="binaural">◉ Sonidos binaurales (concentración)</button>
          </div>
          <div class="flex items-center gap-3 mt-4"><span class="text-xs muted">Volumen</span><input id="volumeRange" type="range" min="0" max="0.22" step="0.01" value="0.07"><button id="soundOff" class="text-xs font-bold muted">Silenciar</button></div>
        </section>
      </div>
    </div>

    <section class="mt-5 glass rounded-[26px] p-5 sm:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div><p class="eyebrow mb-1">Centro de descanso</p><h2 class="font-bold text-lg">Recarga antes de volver.</h2><p class="text-sm muted mt-1">Actividades breves y tranquilas para despejar la mente.</p></div>
        <button id="restHubBtn" class="btn btn-soft">Abrir centro de descanso <span>→</span></button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5">
        <button class="choice flex items-center gap-3" data-open="movement"><span class="text-2xl">🌿</span><span class="text-left"><strong class="block text-sm">Movimiento</strong><small class="muted">Activa o estira el cuerpo</small></span></button>
        <button class="choice flex items-center gap-3" data-open="breathing"><span class="text-2xl">◉</span><span class="text-left"><strong class="block text-sm">Respiración 4-7-8</strong><small class="muted">Baja el ritmo con calma</small></span></button>
        <button class="choice flex items-center gap-3" data-open="arcade"><span class="text-2xl">▦</span><span class="text-left"><strong class="block text-sm">Salón arcade</strong><small class="muted">Retos mentales cortos</small></span></button>
      </div>
    </section>

    <footer class="text-center text-xs muted py-7">PomoFlow · Tu atención es un recurso valioso. Cuídala.</footer>
  </main>

  <div id="modalRoot"></div>
  <div id="focusRoot"></div>
  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const KEY = 'pomoflow_v1';
    const defaults = {durations:{focus:25,short:5,long:15},tasks:[],sessions:0,focusMinutes:0,selectedSound:null,volume:.07};
    let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
    const data={...defaults,...saved,durations:{...defaults.durations,...(saved.durations||{})},tasks:Array.isArray(saved.tasks)?saved.tasks:[]};
    let mode='focus', total=data.durations.focus*60, remaining=total, timer=null, running=false, focusSessionLocked=false, audioCtx=null, soundNodes=[], activeSound=null;
    const circumference=2*Math.PI*98;
    $('#progressRing').style.strokeDasharray=circumference;
    function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
    function fmt(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function renderTimer(){
      $('#timerDisplay').textContent=fmt(remaining);
      $('#progressRing').style.strokeDashoffset=circumference*(1-remaining/total);
      $('#startBtn').textContent=running?'Ⅱ Pausar':'▶ '+(remaining===total?'Comenzar':'Continuar');
      $('#timerState').textContent=running?'En marcha':remaining===total?'Preparado':'En pausa';
      $('#statusText').textContent=running?(mode==='focus'?'En concentración':'En descanso'):'Listo para empezar';
      $('#timerCaption').textContent=mode==='focus'?'TIEMPO PARA TI':'TÓMATE UN RESPIRO';
      $('#timerSub').textContent=mode==='focus'?'Un paso, sin interrupciones':'Desconecta un momento';
      $('#modeTitle').textContent=mode==='focus'?'Sesión de enfoque':mode==='short'?'Descanso corto':'Descanso largo';
      $('#durationRange').value=data.durations[mode];$('#durationValue').textContent=data.durations[mode]+' min';
      $('#durationLabel').textContent=mode==='focus'?'Duración de enfoque':mode==='short'?'Duración del descanso corto':'Duración del descanso largo';
      $$('#modeButtons .mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
      $('#durationRange').min=mode==='focus'?10:1;$('#durationRange').max=mode==='focus'?60:30;$('#durationRange').step=mode==='focus'?5:1;
    }
    function setMode(next){pauseTimer();mode=next;if(next!=='focus')focusSessionLocked=false;total=data.durations[mode]*60;remaining=total;renderTimer();renderFocusScreen()}
    function pauseTimer(){if(timer)clearInterval(timer);timer=null;running=false;renderTimer();renderFocusScreen()}
    function focusMarkup(){
      return `<div class="focus-backdrop"><section class="focus-screen">
        <button class="btn btn-quiet focus-close" id="exitFocus" aria-label="Volver al panel">✕ Volver</button>
        <p class="focus-mode-label" id="focusModeLabel">${mode==='focus'?'Sesión de enfoque':mode==='short'?'Descanso corto':'Descanso largo'}</p>
        <div class="ring-wrap">
          <svg viewBox="0 0 220 220" aria-label="Progreso del temporizador">
            <circle class="ring-track" cx="110" cy="110" r="98"></circle>
            <circle class="ring-progress" id="focusProgressRing" cx="110" cy="110" r="98"></circle>
          </svg>
          <div class="ring-center"><div class="eyebrow mb-1" id="focusCaption">${mode==='focus'?'TIEMPO PARA TI':'TÓMATE UN RESPIRO'}</div><div class="timer-time" id="focusTimerDisplay">${fmt(remaining)}</div><div class="text-xs muted mt-1" id="focusSub">${mode==='focus'?'Un paso, sin interrupciones':'Desconecta un momento'}</div></div>
        </div>
        <div class="flex items-center justify-center gap-3 mt-2">
          <button class="btn btn-quiet" id="focusReset">↺ Reiniciar</button>
          <button class="btn btn-primary min-w-36" id="focusToggle">${running?'Ⅱ Pausar':'▶ Continuar'}</button>
        </div>
        <p class="text-xs muted mt-7">Una sola cosa. Este momento es tuyo.</p>
      </section></div>`;
    }
    function renderFocusScreen(){
      if(!$('#focusTimerDisplay'))return;
      $('#focusTimerDisplay').textContent=fmt(remaining);
      $('#focusProgressRing').style.strokeDasharray=circumference;
      $('#focusProgressRing').style.strokeDashoffset=circumference*(1-remaining/total);
      $('#focusToggle').textContent=running?'Ⅱ Pausar':'▶ Continuar';
      $('#focusModeLabel').textContent=mode==='focus'?'Sesión de enfoque':mode==='short'?'Descanso corto':'Descanso largo';
      $('#focusCaption').textContent=mode==='focus'?'TIEMPO PARA TI':'TÓMATE UN RESPIRO';
      $('#focusSub').textContent=mode==='focus'?'Un paso, sin interrupciones':'Desconecta un momento';
    }
    function enterFocusScreen(){ $('#focusRoot').innerHTML=focusMarkup(); $('#exitFocus').onclick=()=>{$('#focusRoot').innerHTML=''}; $('#focusToggle').onclick=()=>{if(running)pauseTimer();else startTimer()}; $('#focusReset').onclick=()=>{pauseTimer();remaining=total;renderTimer();renderFocusScreen()};renderFocusScreen() }
    function startTimer(){if(running){pauseTimer();return}if(remaining<=0)remaining=total;if(mode==='focus')focusSessionLocked=true;running=true;renderTimer();if(!$('#focusTimerDisplay'))enterFocusScreen();renderFocusScreen();timer=setInterval(()=>{remaining--;renderTimer();renderFocusScreen();if(remaining<=0)finishTimer()},1000)}
    function finishTimer(){
      pauseTimer();
      if(mode==='focus'){focusSessionLocked=false;data.sessions++;data.focusMinutes+=data.durations.focus;persist();renderStats();openRestHub(true)}
      else{openModal(`<div class="text-center"><div class="text-4xl mb-3">🌱</div><p class="eyebrow">Descanso terminado</p><h2 class="display text-2xl font-extrabold mt-2">Cuando quieras, volvemos.</h2><p class="muted text-sm mt-2">Prepara tu siguiente bloque de concentración.</p><button class="btn btn-primary mt-6" id="backFocus">Volver al enfoque</button></div>`);$('#backFocus').onclick=()=>{closeModal();setMode('focus')}}
    }
    function renderStats(){$('#sessionCount').textContent=data.sessions;$('#focusMinutes').textContent=data.focusMinutes}
    function renderTasks(){
      const list=$('#taskList');list.innerHTML='';
      if(!data.tasks.length){list.innerHTML='<p class="text-sm muted py-5 text-center">Tu tablón está despejado. Añade una misión pequeña para empezar.</p>'}
      data.tasks.forEach(task=>{
        const row=document.createElement('div');row.className='task-row '+(task.done?'task-done':'');
        const check=document.createElement('input');check.type='checkbox';check.className='task-check';check.checked=task.done;check.setAttribute('aria-label','Completar misión');
        check.onchange=()=>{task.done=check.checked;persist();renderTasks()};
        const body=document.createElement('div');body.className='flex-1 min-w-0';
        const name=document.createElement('p');name.className='task-name text-sm font-semibold break-words';name.textContent=task.name;
        const meta=document.createElement('div');meta.className='flex items-center gap-2 mt-1';const diff=document.createElement('span');diff.className='pill '+task.difficulty;diff.textContent={easy:'Fácil',medium:'Media',hard:'Difícil'}[task.difficulty];const estimate=document.createElement('span');estimate.className='text-[10px] muted';estimate.textContent=task.estimate==='1'?'1 bloque':task.estimate==='2'?'2 bloques':'3+ bloques';meta.append(diff,estimate);body.append(name,meta);
        const del=document.createElement('button');del.className='text-lg muted px-2';del.textContent='×';del.title='Eliminar misión';del.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==task.id);persist();renderTasks()};
        row.append(check,body,del);list.append(row);
      });
      const done=data.tasks.filter(t=>t.done).length,pending=data.tasks.length-done;
      $('#taskCounter').textContent=pending===1?'1 pendiente':`${pending} pendientes`;$('#taskProgress').textContent=data.tasks.length?`${done} de ${data.tasks.length} misiones completadas`:'Completa una misión para avanzar.';
    }
    $('#taskForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#taskInput').value.trim();if(!name)return;data.tasks.push({id:Date.now()+Math.random(),name,difficulty:$('#taskDifficulty').value,estimate:$('#taskEstimate').value,done:false});$('#taskInput').value='';persist();renderTasks()});
    $('#clearDoneBtn').onclick=()=>{data.tasks=data.tasks.filter(t=>!t.done);persist();renderTasks()};
    $$('#modeButtons .mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    $('#durationRange').oninput=e=>{const n=Number(e.target.value);data.durations[mode]=n;total=n*60;remaining=total;persist();renderTimer()};
    $('#startBtn').onclick=startTimer;$('#resetBtn').onclick=()=>{pauseTimer();remaining=total;renderTimer()};
    $('#skipBtn').onclick=()=>setMode(mode==='focus'?'short':mode==='short'?'long':'focus');
    $('#volumeRange').value=data.volume;
    $('#volumeRange').oninput=e=>{data.volume=Number(e.target.value);persist();if(activeSound)playSound(activeSound)};
    $('#soundOff').onclick=()=>stopSound();
    $$('#soundList button').forEach(b=>b.onclick=()=>playSound(b.dataset.sound));
    function stopSound(){soundNodes.forEach(n=>{try{n.stop?.();n.disconnect?.()}catch(e){}});soundNodes=[];activeSound=null;$$('#soundList button').forEach(b=>b.classList.remove('sound-active'))}
    function playSound(kind){
      stopSound();activeSound=kind;$$('#soundList button').forEach(b=>b.classList.toggle('sound-active',b.dataset.sound===kind));
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();
      const master=audioCtx.createGain();master.gain.value=data.volume;master.connect(audioCtx.destination);soundNodes.push(master);
      const noise=(filterType,frequency,q=0.7,gain=1)=>{
        const size=2*audioCtx.sampleRate,buffer=audioCtx.createBuffer(1,size,audioCtx.sampleRate),out=buffer.getChannelData(0);
        let last=0;for(let i=0;i<size;i++){let white=Math.random()*2-1;last=kind==='brown'?.985*last+.02*white:white;out[i]=kind==='brown'?last:white}
        const src=audioCtx.createBufferSource();src.buffer=buffer;src.loop=true;
        const filter=audioCtx.createBiquadFilter();filter.type=filterType;filter.frequency.value=frequency;filter.Q.value=q;
        const g=audioCtx.createGain();g.gain.value=gain;src.connect(filter);filter.connect(g);g.connect(master);src.start();soundNodes.push(src,filter,g);
      };
      if(kind==='binaural'){
        // Dos tonos distintos, uno en cada oído; requiere auriculares estéreo.
        const left=audioCtx.createOscillator(),right=audioCtx.createOscillator();
        const leftGain=audioCtx.createGain(),rightGain=audioCtx.createGain();
        const leftPan=audioCtx.createStereoPanner(),rightPan=audioCtx.createStereoPanner();
        left.type=right.type='sine';left.frequency.value=200;right.frequency.value=210;
        leftGain.gain.value=rightGain.gain.value=.16;
        leftPan.pan.value=-1;rightPan.pan.value=1;
        left.connect(leftGain);leftGain.connect(leftPan);leftPan.connect(master);
        right.connect(rightGain);rightGain.connect(rightPan);rightPan.connect(master);
        left.start();right.start();
        soundNodes.push(left,right,leftGain,rightGain,leftPan,rightPan);
      }
      else if(kind==='brown'||kind==='white'){noise('lowpass',kind==='brown'?450:5000,0.4,1)}
      else if(kind==='rain'){noise('lowpass',1800,.5,.7);noise('highpass',3500,.5,.12)}
      else if(kind==='ocean'){noise('lowpass',700,.5,.7);const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();lfo.frequency.value=.12;lg.gain.value=.22;lfo.connect(lg);lg.connect(master.gain);lfo.start();soundNodes.push(lfo,lg)}
      else if(kind==='wind'){noise('lowpass',550,.4,.5);const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.value=95;g.gain.value=.035;osc.connect(g);g.connect(master);osc.start();soundNodes.push(osc,g)}
      else if(kind==='forest'||kind==='night'){noise('lowpass',kind==='forest'?900:420,.7,.25);[kind==='forest'?740:520,kind==='forest'?880:660].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.008;o.connect(g);g.connect(master);o.start();soundNodes.push(o,g)})}
    }
    function openModal(content, extraClass=''){const gameClass=extraClass?' game-fullscreen':'';const backdropClass=extraClass?'modal-backdrop game-backdrop':'modal-backdrop';$('#modalRoot').innerHTML=`<div class="${backdropClass}" id="backdrop"><div class="modal${gameClass}" role="dialog" aria-modal="true">${content}</div></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});const x=$('#closeModal');if(x)x.onclick=closeModal}
    function closeModal(){pauseBreath();$('#modalRoot').innerHTML=''}
    function closeButton(){return '<button id="closeModal" class="btn btn-quiet !p-2" aria-label="Cerrar">✕</button>'}
    function openRestHub(auto=false){
      openModal(`<div class="flex items-start justify-between"><div><p class="eyebrow">Centro de descanso</p><h2 class="display text-2xl font-extrabold mt-1">${auto?'¡Buen trabajo!':'Despeja la mente.'}</h2><p class="muted text-sm mt-2">${auto?'Has completado un bloque. Elige cómo quieres descansar.':'Elige una pausa breve y vuelve con energía.'}</p></div>${closeButton()}</div>
      <div class="grid sm:grid-cols-3 gap-3 mt-6">
        <button class="choice" data-rest="movement"><div class="text-2xl mb-2">🌿</div><strong class="text-sm block">Movimiento</strong><span class="text-xs muted">Según tu entorno</span></button>
        <button class="choice" data-rest="breathing"><div class="text-2xl mb-2">◉</div><strong class="text-sm block">Respirar 4-7-8</strong><span class="text-xs muted">Calma y presencia</span></button>
        <button class="choice" data-rest="arcade"><div class="text-2xl mb-2">▦</div><strong class="text-sm block">Salón arcade</strong><span class="text-xs muted">Retos rápidos</span></button>
      </div><div class="flex justify-between items-center mt-6 pt-4 border-t border-[var(--line)]"><span class="text-xs muted">Tu pausa también forma parte del progreso.</span><button class="btn btn-primary" id="restTimer">Iniciar descanso</button></div>`);
      $('#restTimer').onclick=()=>{closeModal();setMode('short');startTimer()};
      $$('[data-rest]').forEach(b=>{if(focusSessionLocked){b.disabled=true;b.classList.add('opacity-50','cursor-not-allowed');b.querySelector('span:last-child').textContent='Disponible en el descanso'}b.onclick=()=>{if(focusSessionLocked)return;const v=b.dataset.rest;v==='movement'?openMovement():v==='breathing'?openBreathing():openArcade()}});
    }
    function openMovement(){
      if(focusSessionLocked)return;
      openModal(`<div class="flex justify-between items-start"><div><p class="eyebrow">Descanso saludable · 3–5 min</p><h2 class="display text-2xl font-extrabold mt-1">¿Dónde estás ahora?</h2><p class="muted text-sm mt-2">Adaptamos el movimiento a tu espacio y a tu comodidad.</p></div>${closeButton()}</div>
      <div class="grid sm:grid-cols-2 gap-3 mt-5"><button class="choice" id="openSpace"><div class="text-2xl mb-2">🌳</div><strong class="text-sm block">Espacio abierto / privado</strong><span class="text-xs muted">Puedo moverme con libertad</span></button><button class="choice" id="officeSpace"><div class="text-2xl mb-2">🪴</div><strong class="text-sm block">Oficina / con gente</strong><span class="text-xs muted">Prefiero movimientos discretos</span></button></div><div id="movementPlan" class="mt-4"></div>`);
      $('#openSpace').onclick=()=>showMovementPlan('open');$('#officeSpace').onclick=()=>showMovementPlan('office');
    }
    function showMovementPlan(place){
      $$('#openSpace,#officeSpace').forEach(b=>b.classList.toggle('selected',b.id===(place==='open'?'openSpace':'officeSpace')));
      const items=place==='open'?[['Sentadillas suaves','8–12 repeticiones'],['Flexiones contra pared o suelo','6–10 repeticiones'],['Camina y mueve los hombros','45 segundos'],['Estira piernas sin rebotes','30 segundos']]:[['Cuello','Inclina suavemente a cada lado · 15 s'],['Hombros','Haz círculos lentos · 10 repeticiones'],['Muñecas','Gira y abre/cierra las manos · 20 s'],['Espalda','Alarga la columna y respira · 30 s']];
      $('#movementPlan').innerHTML=`<div class="glass-strong rounded-2xl p-4"><p class="eyebrow mb-3">${place==='open'?'Mini activación':'Estiramientos discretos'}</p>${items.map((x,i)=>`<label class="flex items-center gap-3 py-2 border-b border-[var(--line)] last:border-0 text-sm"><input type="checkbox" class="task-check"><span><strong>${x[0]}</strong><span class="block text-xs muted">${x[1]}</span></span></label>`).join('')}<p class="text-xs muted mt-3">Hazlo sin dolor, sin forzar y detente si notas mareo o molestias.</p></div>`;
    }
    let breathInterval=null, breathStep=0, breathSeconds=4, breathCycles=0;
    function pauseBreath(){if(breathInterval)clearInterval(breathInterval);breathInterval=null}
    function openBreathing(){
      if(focusSessionLocked)return;
      pauseBreath();breathStep=0;breathSeconds=4;breathCycles=0;
      openModal(`<div class="flex justify-between items-start"><div><p class="eyebrow">Pausa consciente</p><h2 class="display text-2xl font-extrabold mt-1">Respiración 4-7-8</h2><p class="muted text-sm mt-2">Sigue el ritmo sin forzar. Si te resulta incómodo, respira con normalidad.</p></div>${closeButton()}</div>
      <div class="flex flex-col items-center py-7"><div class="breath-orb" id="breathOrb"></div><p class="display text-xl font-bold mt-6" id="breathLabel">Inhala</p><p class="timer-time !text-4xl mt-1" id="breathCount">4</p><p class="text-xs muted mt-2" id="breathCycle">Ciclo 1 · 3 recomendados</p></div><div class="flex justify-center gap-2"><button class="btn btn-primary" id="breathStart">Comenzar guía</button><button class="btn btn-quiet" id="breathStop">Detener</button></div><p class="text-xs muted text-center mt-4">No hagas esta técnica mientras conduces. Si retener el aire te marea, para.</p>`);
      $('#breathStart').onclick=startBreath;$('#breathStop').onclick=()=>{pauseBreath();$('#breathLabel').textContent='Pausa';$('#breathOrb').className='breath-orb'};
    }
    function startBreath(){
      pauseBreath();let step=0,secs=4,cycle=1;
      const phases=[{name:'Inhala',secs:4,cls:'inhale'},{name:'Mantén',secs:7,cls:'hold'},{name:'Exhala suavemente',secs:8,cls:'exhale'}];
      function paint(){const p=phases[step];$('#breathLabel').textContent=p.name;$('#breathCount').textContent=secs;$('#breathCycle').textContent=`Ciclo ${cycle} · 3 recomendados`;$('#breathOrb').className='breath-orb '+p.cls}
      paint();breathInterval=setInterval(()=>{secs--;if(secs<=0){step++;if(step>=3){step=0;cycle++;if(cycle>3){pauseBreath();$('#breathLabel').textContent='Sesión completada';$('#breathCount').textContent='✓';$('#breathOrb').className='breath-orb';return}}secs=phases[step].secs}paint()},1000);
    }
    function openArcade(){
      if(focusSessionLocked){openModal(`<div class="text-center">${closeButton()}<div class="text-4xl mb-3">🎯</div><h2 class="display text-2xl font-extrabold">Primero termina tu bloque.</h2><p class="muted text-sm mt-2">El salón arcade estará disponible durante el descanso.</p><button class="btn btn-primary mt-5" id="backToFocus">Volver a concentrarme</button></div>`);$('#backToFocus').onclick=closeModal;return}
      openModal(`<div class="flex justify-between items-start"><div><p class="eyebrow">Salón arcade</p><h2 class="display text-2xl font-extrabold mt-1">Un reto pequeño.</h2><p class="muted text-sm mt-2">Elige una actividad breve y vuelve a tu misión.</p></div>${closeButton()}</div>
      <div class="grid sm:grid-cols-3 gap-3 mt-6"><button class="choice" id="playWordle"><div class="text-2xl mb-2">🟩</div><strong class="text-sm block">Wordle</strong><span class="text-xs muted">Adivina una palabra</span></button><button class="choice" id="playCross"><div class="text-2xl mb-2">▦</div><strong class="text-sm block">Mini crucigrama</strong><span class="text-xs muted">Asocia conceptos</span></button><button class="choice" id="playLanguage"><div class="text-2xl mb-2">🌍</div><strong class="text-sm block">Microlección</strong><span class="text-xs muted">Un minuto de idioma</span></button></div>
      <p class="text-xs muted mt-5">Las microlecciones son ejercicios originales de vocabulario, inspirados en el aprendizaje por repetición; no requieren cuenta ni conexión.</p>`);
      $('#playWordle').onclick=openWordle;$('#playCross').onclick=openCrossword;$('#playLanguage').onclick=openLanguage;
    }
    const word='NUBES', guesses=[];
    function openWordle(){
      if(focusSessionLocked)return;
      let rows=Array.from({length:6},()=>''),ended=false;
      function draw(){
        const grid=rows.map((r,i)=>{let cells='';for(let j=0;j<5;j++){let cls='';if(i<guesses.length){const ch=r[j];cls=ch===word[j]?'correct':word.includes(ch)?'present':'absent'}cells+=`<div class="word-cell ${cls}">${r[j]||''}</div>`}return `<div class="flex justify-center gap-2 mb-2">${cells}</div>`}).join('');
        openModal(`<div class="flex justify-between items-start"><div><p class="eyebrow">Salón arcade · Palabras</p><h2 class="display text-2xl font-extrabold mt-1">Wordle breve</h2><p class="muted text-xs mt-1">Adivina la palabra de 5 letras en 6 intentos.</p></div>${closeButton()}</div><div class="my-6">${grid}</div><div class="flex gap-2 max-w-xs mx-auto"><input id="wordInput" class="field uppercase text-center tracking-widest font-bold" maxlength="5" placeholder="PALABRA" autocomplete="off"><button class="btn btn-primary" id="wordSubmit">Probar</button></div><p id="wordMessage" class="text-center text-sm muted mt-3">Verde: letra y lugar · Ocre: está en otra posición.</p>`, 'game');
        $('#wordSubmit').onclick=submit;$('#wordInput').onkeydown=e=>{if(e.key==='Enter')submit()};$('#wordInput').focus();
      }
      function submit(){if(ended)return;const val=$('#wordInput').value.trim().toLocaleUpperCase('es');if(!/^[A-ZÁÉÍÓÚÜÑ]{5}$/.test(val)){ $('#wordMessage').textContent='Escribe una palabra de 5 letras.';return}
        rows[guesses.length]=val;guesses.push(val);if(val===word){ended=true;draw();$('#wordMessage').textContent='¡Lo has conseguido!';return}if(guesses.length>=6){ended=true;draw();$('#wordMessage').textContent='La palabra era NUBES. ¡Buen intento!';return}draw();
      }
      draw();
    }
    function openCrossword(){
      if(focusSessionLocked)return;
      const answers=['LUNA','FOCO','CALMA'];
      openModal(`<div class="flex justify-between items-start"><div><p class="eyebrow">Salón arcade · Asociación</p><h2 class="display text-2xl font-extrabold mt-1">Mini crucigrama</h2><p class="muted text-xs mt-1">Completa las tres palabras con las pistas.</p></div>${closeButton()}</div>
      <div class="flex flex-col items-center gap-2 mt-6"><div class="flex gap-1">${[...'LUNA'].map((_,i)=>`<div class="cross-cell"><small>${i===0?'1':''}</small><input maxlength="1" data-answer="LUNA" data-index="${i}" class="w-full h-full text-center bg-transparent outline-none uppercase"></div>`).join('')}</div><div class="flex gap-1">${[...'FOCO'].map((_,i)=>`<div class="cross-cell"><small>${i===0?'2':''}</small><input maxlength="1" data-answer="FOCO" data-index="${i}" class="w-full h-full text-center bg-transparent outline-none uppercase"></div>`).join('')}</div><div class="flex gap-1">${[...'CALMA'].map((_,i)=>`<div class="cross-cell"><small>${i===0?'3':''}</small><input maxlength="1" data-answer="CALMA" data-index="${i}" class="w-full h-full text-center bg-transparent outline-none uppercase"></div>`).join('')}</div></div>
      <div class="mt-5 space-y-2 text-sm"><p><strong>1.</strong> Satélite natural de la Tierra (4).</p><p><strong>2.</strong> Atención intensa en una sola tarea (4).</p><p><strong>3.</strong> Estado de tranquilidad (5).</p></div><button class="btn btn-primary w-full mt-5" id="checkCross">Comprobar respuestas</button><p id="crossFeedback" class="text-center text-sm muted mt-3"></p>`, 'game');
      $$('[data-answer]').forEach(inp=>inp.oninput=()=>{inp.value=inp.value.slice(-1).toUpperCase();if(inp.value){const all=$$(`[data-answer="${inp.dataset.answer}"]`),idx=Number(inp.dataset.index);if(all[idx+1])all[idx+1].focus()}});
      $('#checkCross').onclick=()=>{let ok=0;answers.forEach(a=>{const inputs=$$(`[data-answer="${a}"]`);const val=inputs.map(i=>i.value.toUpperCase()).join('');if(val===a){ok++;inputs.forEach(i=>i.parentElement.style.background='#e0ebe2')} });$('#crossFeedback').textContent=ok===3?'¡Crucigrama completado!':`${ok} de 3 palabras correctas. ¡Sigue probando!`};
    }
    function openLanguage(){
      if(focusSessionLocked)return;
      const qs=[{q:'¿Qué significa “steady”?',opts:['Estable','Ruidoso','Rápido'],a:0,why:'“Steady” significa estable o constante.'},{q:'Completa: “I ___ focused.”',opts:['am','is','are'],a:0,why:'Con “I” usamos “am”: I am focused.'},{q:'¿Cuál es el antónimo de “begin”?',opts:['Create','Finish','Build'],a:1,why:'“Finish” significa terminar; es lo contrario de comenzar.'}];
      let i=0,score=0;
      function draw(){const q=qs[i];openModal(`<div class="flex justify-between items-start"><div><p class="eyebrow">Salón arcade · Idiomas</p><h2 class="display text-2xl font-extrabold mt-1">Microlección de inglés</h2><p class="muted text-xs mt-1">Pregunta ${i+1} de ${qs.length} · Un minuto de práctica</p></div>${closeButton()}</div><div class="h-1.5 bg-[#e3e9e3] rounded-full mt-5 overflow-hidden"><div class="h-full bg-[var(--accent-primary)]" style="width:${(i/qs.length)*100}%"></div></div><h3 class="font-bold text-xl mt-7">${q.q}</h3><div class="grid gap-2 mt-4">${q.opts.map((o,j)=>`<button class="choice text-left text-sm" data-option="${j}">${o}</button>`).join('')}</div><p id="languageFeedback" class="text-sm muted mt-4 min-h-6"></p><button id="languageNext" class="btn btn-primary w-full mt-2" disabled>${i===2?'Finalizar':'Siguiente'}</button>`, 'game');
        let answered=false;$$('[data-option]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const correct=Number(b.dataset.option)===q.a;if(correct)score++;$$('[data-option]').forEach(x=>{x.disabled=true;if(Number(x.dataset.option)===q.a)x.classList.add('selected')});$('#languageFeedback').textContent=(correct?'¡Correcto! ':'Casi. ')+q.why;$('#languageNext').disabled=false});
        $('#languageNext').onclick=()=>{if(i<2){i++;draw()}else{openModal(`<div class="text-center"><div class="text-4xl mb-3">🌱</div><p class="eyebrow">Microlección terminada</p><h2 class="display text-2xl font-extrabold mt-2">${score}/${qs.length} respuestas correctas</h2><p class="muted text-sm mt-2">Pequeñas prácticas, progreso constante.</p><button class="btn btn-primary mt-6" id="languageAgain">Repetir lección</button></div>`);$('#languageAgain').onclick=()=>{i=0;score=0;draw()}}};
      }draw();
    }
    $('#restHubBtn').onclick=()=>openRestHub(false);
    $$('[data-open]').forEach(b=>b.onclick=()=>{const v=b.dataset.open;v==='movement'?openMovement():v==='breathing'?openBreathing():openArcade()});
    $('#settingsBtn').onclick=()=>openModal(`<div class="flex justify-between items-start"><div><p class="eyebrow">Preferencias</p><h2 class="display text-2xl font-extrabold mt-1">Ajustes de PomoFlow</h2></div>${closeButton()}</div><div class="mt-5 space-y-3"><div class="glass-strong rounded-xl p-4"><strong class="text-sm">Tus datos</strong><p class="text-xs muted mt-1">Las misiones, sesiones y tiempos se guardan en este navegador mediante localStorage.</p></div><button id="exportData" class="btn btn-soft w-full">Exportar mis datos (.json)</button><button id="resetData" class="btn btn-quiet w-full">Borrar todos los datos guardados</button></div>`);
    $('#exportData')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pomoflow-datos.json';a.click();URL.revokeObjectURL(url)});
    $('#resetData')?.addEventListener('click',()=>{if(confirm('¿Seguro que quieres borrar todas tus misiones y estadísticas?')){localStorage.removeItem(KEY);location.reload()}});
    renderTimer();renderTasks();renderStats();
    if(data.selectedSound)playSound(data.selectedSound);
    window.addEventListener('beforeunload',()=>{if(timer)clearInterval(timer);stopSound()});
  })();
  </script>
</body>
</html>
